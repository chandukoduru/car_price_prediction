{% extends "base.html" %}
{% block title %}Unable to Estimate | AutoValue{% endblock %}
{% block content %}
<section class="error-page section-pad">
  <div class="container text-center">
    <div class="error-icon"><i class="bi bi-exclamation-circle"></i></div>
    <span class="eyebrow eyebrow-light">A QUICK CHECK</span>
    <h1 class="page-title">We couldn’t complete that estimate.</h1>
    <p class="page-subtitle mx-auto">{{ message }}</p>
    <a href="{{ url_for('home') }}#predict-form" class="btn btn-primary btn-lg mt-3">Return to the form</a>
  </div>
</section>
{% endblock %}
