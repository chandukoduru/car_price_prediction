<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1730">
  <title>{% block title %}AutoValue | Car Price Prediction{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark site-nav">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('home') }}">
        <span class="brand-mark"><i class="bi bi-speedometer2"></i></span>
        Auto<span class="brand-accent">Value</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <a class="nav-link" href="{{ url_for('home') }}">Home</a>
          <a class="nav-link" href="{{ url_for('about') }}">About</a>
          <a class="btn btn-nav ms-lg-2" href="{{ url_for('home') }}#predict-form">Get an estimate <i class="bi bi-arrow-up-right ms-1"></i></a>
        </div>
      </div>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container d-flex flex-column flex-lg-row justify-content-between align-items-center gap-3">
      <a class="footer-brand" href="{{ url_for('home') }}">AutoValue <span>· Academic ML Project</span></a>
      <div class="footer-contact">
        <span class="footer-owner">KODURU CHANDRA OBUL REDDY</span>
        <a href="tel:+918317502133" aria-label="Call KODURU CHANDRA OBUL REDDY at +91 8317502133">
          <i class="bi bi-telephone me-1" aria-hidden="true"></i>+91 8317502133
        </a>
      </div>
      <p class="footer-disclaimer mb-0">Estimates are for educational purposes and are not guaranteed market offers.</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
